<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI Gateway - 登录</title>
    <link href="/js/bootstrap.min.css?v=2" rel="stylesheet">
    <link href="/js/bootstrap-icons.css?v=2" rel="stylesheet">
    <style>
        [v-cloak] { display: none !important; }
        :root {
            --neon-blue: #00f0ff;
            --neon-purple: #a855f7;
            --neon-green: #00e676;
            --neon-red: #ff5252;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * { scrollbar-width: thin; scrollbar-color: rgba(0,240,255,0.25) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.25); border-radius: 3px; }

        html, body {
            margin: 0;
            height: 100vh;
            background: #020810;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .bg-img {
            position: fixed; inset: 0; z-index: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .bg-veil {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(ellipse at 50% 40%,
                        rgba(2,8,16,0.35) 0%, rgba(2,8,16,0.82) 70%, rgba(2,8,16,0.94) 100%);
            pointer-events: none;
        }

        .login-stage {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(8, 18, 32, 0.72);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(0, 240, 255, 0.18);
            border-radius: 18px;
            padding: 38px 34px 30px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.55), 0 0 40px rgba(0,240,255,0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .brand-logo {
            width: 42px; height: 42px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 700; color: #fff;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 1.12rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            line-height: 1.25;
        }
        .brand-sub {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .field { margin-bottom: 16px; }
        .field-label {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .field-icon {
            position: absolute;
            left: 12px;
            color: rgba(0, 240, 255, 0.55);
            font-size: 0.95rem;
            pointer-events: none;
        }
        .neon-input {
            width: 100%;
            background: rgba(10, 18, 34, 0.72);
            border: 1px solid rgba(0, 240, 255, 0.22);
            color: #e0f7ff;
            border-radius: 10px;
            padding: 10px 12px 10px 36px;
            font-size: 0.88rem;
            transition: all 0.2s;
            outline: none;
        }
        .neon-input::placeholder { color: #4a6572; }
        .neon-input:hover {
            border-color: rgba(0, 240, 255, 0.45);
        }
        .neon-input:focus {
            background: rgba(12, 24, 44, 0.88);
            border-color: var(--neon-blue);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.2);
        }
        .pw-toggle {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #4a6572;
            font-size: 0.95rem;
            cursor: pointer;
            padding: 2px 4px;
            transition: color 0.2s;
        }
        .pw-toggle:hover { color: var(--neon-blue); }

        .btn-login {
            width: 100%;
            margin-top: 8px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: #041018;
            border-radius: 10px;
            padding: 11px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 16px rgba(0,240,255,0.28);
        }
        .btn-login:hover:not(:disabled) {
            box-shadow: 0 0 26px rgba(0,240,255,0.48);
            transform: translateY(-1px);
        }
        .btn-login:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.32);
            color: #ffb4b4;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .alert-box i { color: var(--neon-red); flex-shrink: 0; margin-top: 1px; }

        .login-foot {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,240,255,0.1);
            font-size: 0.72rem;
            color: #4a6572;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .foot-hint code {
            color: rgba(0, 240, 255, 0.7);
            background: rgba(0,240,255,0.07);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .spin { animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <img class="bg-img" th:src="${bgUrl}" src="/images/platform-bg.jpg" alt="">
    <div class="bg-veil"></div>

    <div class="login-stage">
        <div class="login-card">
            <div class="brand">
                <div class="brand-logo">AI</div>
                <div>
                    <div class="brand-title">AI Gateway</div>
                    <div class="brand-sub">统一 AI 资源池网关 · 管理控制台</div>
                </div>
            </div>

            <div v-if="errorMsg" class="alert-box">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ errorMsg }}</span>
            </div>

            <form @submit.prevent="doLogin">
                <div class="field">
                    <div class="field-label">用户名</div>
                    <div class="field-wrap">
                        <i class="bi bi-person field-icon"></i>
                        <input class="neon-input" type="text" v-model="username"
                               placeholder="请输入用户名" autocomplete="username"
                               ref="userInput" :disabled="loading">
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">密码</div>
                    <div class="field-wrap">
                        <i class="bi bi-lock field-icon"></i>
                        <input class="neon-input" :type="showPw ? 'text' : 'password'"
                               v-model="password" placeholder="请输入密码"
                               autocomplete="current-password" :disabled="loading">
                        <button type="button" class="pw-toggle" @click="showPw = !showPw"
                                :title="showPw ? '隐藏密码' : '显示密码'">
                            <i :class="showPw ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                        </button>
                    </div>
                </div>

                <button class="btn-login" type="submit" :disabled="loading">
                    <span v-if="loading"><i class="bi bi-arrow-repeat spin me-1"></i>登录中...</span>
                    <span v-else><i class="bi bi-box-arrow-in-right me-1"></i>登 录</span>
                </button>
            </form>

            <div class="login-foot">
                <span class="foot-hint">默认账号 <code>admin</code> / <code>admin</code></span>
                <span>对外 AI 接口不受登录影响</span>
            </div>
        </div>
    </div>
</div>

<script src="/js/vue.global.prod.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const username = ref('');
            const password = ref('');
            const showPw = ref(false);
            const loading = ref(false);
            const errorMsg = ref('');
            const userInput = ref(null);

            async function doLogin() {
                if (loading.value) return;
                errorMsg.value = '';
                if (!username.value.trim() || !password.value) {
                    errorMsg.value = '请输入用户名和密码';
                    return;
                }
                loading.value = true;
                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username.value.trim(),
                            password: password.value
                        })
                    });
                    const json = await resp.json();
                    if (json.code === 200) {
                        // Cookie 已由服务端下发，直接跳首页
                        window.location.href = '/';
                        return;
                    }
                    errorMsg.value = json.message || '登录失败';
                    password.value = '';
                } catch (e) {
                    errorMsg.value = '网络异常: ' + e.message;
                } finally {
                    loading.value = false;
                }
            }

            onMounted(async () => {
                // 已登录直接进首页，避免重复登录
                try {
                    const r = await fetch('/api/auth/me');
                    const j = await r.json();
                    if (j.code === 200) {
                        window.location.href = '/';
                        return;
                    }
                } catch (e) { /* 忽略，正常展示登录页 */ }
                nextTick(() => userInput.value && userInput.value.focus());
            });

            return { username, password, showPw, loading, errorMsg, userInput, doLogin };
        }
    }).mount('#app');
</script>
</body>
</html>
